<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Driver Radar — Bạn Uống Tôi Lái</title>
  <meta name="description" content="Driver Radar cho tài xế Bạn Uống Tôi Lái: mở lên là biết tối nay đứng đâu. Một con số duy nhất — khả năng có khách trong 30 phút — học từ chính cuốc thật của bạn, đồng bộ trên mọi thiết bị." />
  <link rel="manifest" href="radar.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/positioning.css" />
</head>
<body>
  <!-- ═══ BẢN ĐỒ: thành phần quan trọng nhất, chiếm cả màn hình ═══ -->
  <div id="map" aria-label="Bản đồ điểm đứng chờ"></div>

  <!-- ═══ ① TRẠNG THÁI — một dòng, trả lời "có nên nhận khách không" ═══ -->
  <header id="statusbar" class="glass"></header>

  <!-- lọc theo loại xe điểm đó thường nổ (dữ liệu thật, không phải loại quán) -->
  <div id="filters" class="glass">
    <button data-f="all" class="on">Tất cả</button>
    <button data-f="oto">🚗 Ô tô</button>
    <button data-f="may">🏍️ Xe máy</button>
    <span id="syncdot" class="syncdot" title="Đồng bộ">🟢</span>
  </div>

  <!-- chạy sang khu chưa có dữ liệu → đúng MỘT nút, bấm là có điểm -->
  <button id="newzone" class="newzone" hidden>📍 TÌM ĐIỂM QUANH ĐÂY</button>

  <button id="btn-center" class="fab" title="Về vị trí của tôi">◎</button>
  <button id="btn-add" class="fab fab-add" title="Thêm điểm đón">＋</button>

  <!-- ═══ ② QUYẾT ĐỊNH — thứ tài xế nhìn 2 giây là biết phải làm gì ═══ -->
  <section id="card" class="card glass"></section>

  <!-- ═══ THANH DƯỚI: 3 việc, không hơn ═══ -->
  <nav id="nav" class="glass">
    <button id="nav-log">📝<span>Ghi cuốc</span></button>
    <button id="nav-dash">📊<span>Điều phối</span></button>
    <button id="nav-set">⚙️<span>Cài đặt</span></button>
  </nav>

  <!-- ═══ TẦNG 2 — "VÌ SAO?" ═══ -->
  <div id="sheet-why" class="sheet glass" hidden>
    <div class="sheet-h"><b>Vì sao đề xuất chỗ này?</b><button class="sheet-x">✕</button></div>
    <div id="why-body"></div>
  </div>

  <!-- ═══ TẦNG 2 — ĐIỀU PHỐI ═══ -->
  <div id="sheet-dash" class="sheet glass" hidden>
    <div class="sheet-h"><b>📊 Hiệu quả của bạn</b><button class="sheet-x">✕</button></div>
    <div id="dash-body"></div>
  </div>

  <!-- ═══ CÀI ĐẶT ═══ -->
  <div id="sheet-set" class="sheet glass" hidden>
    <div class="sheet-h"><b>⚙️ Cài đặt</b><button class="sheet-x">✕</button></div>
    <div id="set-body"></div>
  </div>

  <!-- ═══ TẦNG 3 — CHẨN ĐOÁN (kỹ thuật, tài xế không cần thấy) ═══ -->
  <div id="sheet-diag" class="sheet glass" hidden>
    <div class="sheet-h"><b>⚙️ Chẩn đoán hệ thống</b><button class="sheet-x">✕</button></div>
    <div id="diag-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- kho điểm dựng sẵn (dùng lúc mới mở app / mất mạng) -->
  <script src="js/spots.js"></script>
  <script src="js/butl-partners.js"></script>
  <script src="js/learned-spots.js"></script>
  <!-- ba tầng, đúng thứ tự: LÕI → ĐỒNG BỘ → GIAO DIỆN -->
  <script src="js/positioning.js"></script>
  <script src="js/radar-sync.js"></script>
  <script src="js/radar-ui.js"></script>
  <script>
    // Service worker: có bản mới thì tự nạp lại một lần, để mọi máy không kẹt ở 2 phiên bản code.
    if ('serviceWorker' in navigator && navigator.serviceWorker.register) {
      let done = false; const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (done || !had) return; done = true; location.reload(); });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        reg.update().catch(() => {});
        reg.addEventListener('updatefound', () => {
          const w = reg.installing; if (!w) return;
          w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage({ type: 'SKIP_WAITING' }); });
        });
      }).catch(() => {});
    }
  </script>
</body>
</html>
